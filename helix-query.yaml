version: 1

indices:
  # Magazine articles — feeds the homepage "Recent Articles" cards, which query
  # this index at runtime (newest first) instead of hard-coding the list.
  magazine:
    include:
      - '/us/en/magazine/**'
    exclude:
      # the listing page itself is not an article
      - '/us/en/magazine'
    target: /us/en/magazine/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
